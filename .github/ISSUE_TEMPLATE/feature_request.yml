---
name: Feature request
description: Propose an improvement (check the README Roadmap first)
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [TUI, CLI, Web UI, Core logic, Docs / packaging, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mention TUI/CLI/web parity if relevant
