---
name: Permintaan fitur
description: Usulkan perbaikan (cek Roadmap di README terlebih dahulu)
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [TUI, CLI, Web UI, Core logic, Docs / packaging, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Masalah
      description: Apa yang belum bisa Anda lakukan saat ini, atau apa yang menyulitkan?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan
      description: Bagaimana seharusnya cara kerjanya? Sebutkan paritas TUI/CLI/web jika relevan
