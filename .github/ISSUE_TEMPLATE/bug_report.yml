---
name: Laporan bug
description: Ada yang rusak di TUI, CLI, atau UI web
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versi (`python vnswap.py --version`)
      placeholder: 1.2.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Antarmuka
      options: [TUI, CLI (--cli), Web (--web)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi
      description: Apa yang Anda lakukan, apa yang Anda harapkan, apa yang terjadi sebenarnya
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Lingkungan
      description: Versi Python, ada/tidaknya ffmpeg, Termux atau OS lain
      placeholder: python 3.12, ffmpeg ada, Termux di Android 14
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Tempel baris log TUI, output terminal, atau teks panel log web
      render: text
