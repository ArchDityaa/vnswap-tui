[project]
name = "vnswap-tui"
version = "1.10.0"
description = "Tukar voice note WhatsApp langsung dari Termux — TUI, CLI, dan UI web."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vnswap = "vnswap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
