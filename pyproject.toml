[project]
name = "vnswap-tui"
version = "1.4.0"
description = "Swap WhatsApp voice notes directly from Termux — TUI, CLI, and web UI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vnswap = "vnswap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
